# Dapr Pub/Sub Component for event streaming
#
# Enables the planner-agent to publish execution events
# (tool calls, progress, completions) to the workflow.stream topic.
# The ai-chatbot subscribes to this topic to receive real-time updates.
#
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: planner-agent
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      # Use the same Redis instance as ai-chatbot for shared topic
      value: redis.ai-chatbot.svc.cluster.local:6379
    - name: redisPassword
      value: ""
    - name: consumerID
      value: "planner-agent-publisher"
