# Secret for Anthropic API Key
# IMPORTANT: Replace the placeholder with your actual API key (base64 encoded)
#
# To encode your API key:
#   echo -n 'your-api-key-here' | base64
#
# For production, use a secrets manager like:
#   - Kubernetes External Secrets
#   - HashiCorp Vault
#   - AWS Secrets Manager with ExternalSecrets Operator
#
apiVersion: v1
kind: Secret
metadata:
  name: planner-agent-secrets
  namespace: planner-agent
  labels:
    app.kubernetes.io/name: planner-agent
type: Opaque
data:
  # Base64 encoded API key - REPLACE THIS
  # Example: echo -n 'sk-ant-xxxxx' | base64
  ANTHROPIC_API_KEY: UkVQTEFDRV9XSVRIX1lPVVJfQVBJX0tFWQ==
