[metadata]
name = planner-agent
version = 1.0.0
description = A Claude Agent SDK application that replicates Claude Code's plan mode functionality
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/PittampalliOrg/planner-agent
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
python_requires = >=3.10
py_modules =
    main
    planner_agent
    plan_manager
    task_manager
    workflow_service
    streaming
install_requires =
    claude-agent-sdk>=0.1.22
    pydantic>=2.0.0
    rich>=13.0.0
    dapr-ext-workflow>=1.16.0
    dapr>=1.16.0
    fastapi>=0.100.0
    uvicorn>=0.23.0
    httpx>=0.25.0
    gitpython>=3.1.0
