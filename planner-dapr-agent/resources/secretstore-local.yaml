# Local Secret Store Component (Environment Variables)
#
# For local development, reads secrets from environment variables.
# Use this instead of secretstore-azure-keyvault.yaml when running locally.
#
# Required env vars:
#   - OPENAI_API_KEY
#   - ANTHROPIC_API_KEY (optional)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: local-secrets
spec:
  type: secretstores.local.env
  version: v1
  metadata: []
# Scope to planner-dapr-agent only
scopes:
  - planner-dapr-agent
