# DevSpace Configuration for Planner Dapr Agent
# Enables Kubernetes-native development with hot-reload for Python/FastAPI
#
# Architecture:
#   - Targets the planner-dapr-agent deployment in planner-agent namespace
#   - Syncs local Python files to container in real-time
#   - Runs uvicorn with --reload for hot module replacement
#   - Preserves Dapr sidecar for workflow/state/pubsub functionality
#
# Usage:
#   devspace dev                    # Start development mode
#   devspace enter                  # Shell into container
#   devspace sync                   # Manual sync
#   devspace purge                  # Clean up devspace resources

version: v2beta1
name: planner-dapr-agent

# Import shared variable definitions from templates
imports:
  - path: ../../../stacks/main/devspace-templates/base.yaml
  - path: ../../../stacks/main/devspace-templates/snippets/fastapi.yaml

# App-specific variable values
vars:
  APP_NAME: planner-dapr-agent
  APP_NAMESPACE: planner-agent
  LOCAL_PORT: "8000"
  CONTAINER_PORT: "8000"
  SSH_PORT: "2225"
  UVICORN_APP: "app:app"
  UVICORN_PORT: "8000"
  # Override resource defaults for Python apps
  CPU_REQUEST: "200m"
  MEMORY_REQUEST: "512Mi"
  MEMORY_LIMIT: "2Gi"

# Development configuration
dev:
  planner-dapr:
    # Target the deployment (note: different namespace than app name)
    namespace: ${APP_NAMESPACE}
    labelSelector:
      app: ${APP_NAME}
    container: ${APP_NAME}

    # Use shared Python devcontainer (has Node.js, Claude CLI, uvicorn, etc.)
    # Runs as non-root user (UID 1000) for Claude CLI security
    devImage: ${GITEA_HOST}/${GITEA_USER}/python-312-devspace:latest
    workingDir: /app

    # Resource requirements for development
    resources:
      requests:
        cpu: ${CPU_REQUEST}
        memory: ${MEMORY_REQUEST}
      limits:
        cpu: ${CPU_LIMIT}
        memory: ${MEMORY_LIMIT}

    # Command to run in the container
    # Uses uvicorn with --reload for hot module reloading (similar to Next.js dev server)
    command:
      - /bin/sh
      - -c
      - |
        echo "=== Planner Dapr Agent DevSpace Container ==="
        echo "App: ${APP_NAME}"
        echo "Namespace: ${APP_NAMESPACE}"
        echo "Running as user: $(id)"
        which claude && claude --version || echo "Warning: Claude CLI not found"
        echo "Waiting for file sync..."
        while [ ! -f /app/requirements.txt ]; do sleep 1; done
        echo "Installing Python dependencies..."
        pip install --quiet --no-cache-dir -r requirements.txt
        echo "Starting uvicorn with hot reload..."
        exec uvicorn app:app --host 0.0.0.0 --port ${UVICORN_PORT} --reload --reload-dir /app

    # Disable restart helper to avoid permission issues with non-root user
    restartHelper:
      inject: false

    # File synchronization - sync Python source files
    sync:
      - path: ./:/app
        initialSync: mirrorLocal
        startContainer: true
        waitInitialSync: true
        onUpload:
          restartContainer: false
        excludePaths:
          # Python artifacts
          - __pycache__/
          - "*.pyc"
          - "*.pyo"
          - .pytest_cache/
          - .mypy_cache/
          - .ruff_cache/
          - "*.egg-info/"
          - dist/
          - build/
          - .venv/
          - venv/
          # Dev tooling
          - .devenv/
          - .devspace/
          - .direnv/
          - .git
          - .git/
          - .github/
          - .idea/
          - .vscode/
          - .cursor/
          # K8s manifests (not needed at runtime)
          - k8s/
          # Env files (secrets should come from k8s)
          - .env
          - .env.*
          # Docs & config
          - docs/
          - "*.md"
          - "*.log"
          - LICENSE
          - Dockerfile
          - Dockerfile.devspace
          - devenv.*
          - devenv.lock
          - .devenv*
          - .devenv.flake.nix
          - .dockerignore
          - .gitignore
          # Dapr config (use k8s components instead)
          - dapr.yaml
          - resources/

    # Patches to configure the pod for development
    patches:
      # Remove health checks (dev server startup is slower)
      - op: remove
        path: spec.containers.name=${APP_NAME}.livenessProbe
      - op: remove
        path: spec.containers.name=${APP_NAME}.readinessProbe
      # Run as non-root user (planner) - required for Claude CLI security
      # Note: Use integer literals, not variables (DevSpace passes them as strings)
      - op: replace
        path: spec.containers.name=${APP_NAME}.securityContext
        value:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      # Override pod security context
      - op: replace
        path: spec.securityContext
        value:
          fsGroup: 1000
          runAsNonRoot: true

    # Port forwarding for development
    ports:
      - port: "${LOCAL_PORT}:${CONTAINER_PORT}"

    # Environment variables for development
    env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: PYTHONDONTWRITEBYTECODE
        value: "1"
      - name: PLANNER_CWD
        value: /app/workspace
